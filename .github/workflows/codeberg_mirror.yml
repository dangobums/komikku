# Sync repo to the Codeberg mirror
name: Mirror Sync

on:
  push:
    branches: [ "master" ]
  workflow_dispatch: # Manual dispatch
  # schedule:
  #   - cron: "0 */8 * * *"

jobs:
  codeberg:
    # dangobums -->
    # Temporarily disabled (if: false) until I decide whether to set up a Codeberg
    # mirror. To re-enable: create a repo under my own Codeberg account, update
    # target_repo_url below to point at it, add a CODEBERG_SSH secret with my own
    # deploy key, then flip this back to: if: github.repository == 'dangobums/komikku'
    if: false
    # dangobums <--
    runs-on: 'ubuntu-24.04'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CODEBERG_SSH }}" >> ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
      - uses: pixta-dev/repository-mirroring-action@674e65a7d483ca28dafaacba0d07351bdcc8bd75 # v1.1.1
        with:
          target_repo_url: "git@codeberg.org:dangobums/komikku.git"
          ssh_private_key: ${{ secrets.CODEBERG_SSH }}
